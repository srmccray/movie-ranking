name: CI Quality Gate (movie-ranking)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  preflight-and-invariants:
    name: SpecOps Invariant & Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect file changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            artifacts:
              - 'docs/project/adrs/**'
              - 'docs/project/product/**'
              - 'docs/project/backlog/**'
              - 'docs/project/user_stories/**'
              - '.github/workflows/ci.yml'
            health:
              - 'tests/**'
              - '**/*.py'
              - '**/*.ts'
              - '**/*.js'
              - '**/*.html'
              - '**/*.css'
              - 'docs/project/backlog/**'
              - 'docs/project/adrs/**'
              - 'AGENTS.md'
              - 'specops.toml'
              - '.github/workflows/ci.yml'
            python:
              - 'tests/**'
              - '**/*.py'
              - 'pyproject.toml'
              - 'specops.toml'
              - '.github/workflows/ci.yml'

      - name: Install uv
        if: steps.filter.outputs.artifacts == 'true' || steps.filter.outputs.health == 'true' || steps.filter.outputs.python == 'true'
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: false

      - name: Set up Python
        if: steps.filter.outputs.artifacts == 'true' || steps.filter.outputs.health == 'true' || steps.filter.outputs.python == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install SpecOps
        if: steps.filter.outputs.artifacts == 'true' || steps.filter.outputs.health == 'true' || steps.filter.outputs.python == 'true'
        run: uv tool install "git+https://github.com/tyevans/spec-ops@9745c40"

      - name: Verify artifact numbering uniqueness (ADRs, PRDs, Tasks, Stories)
        if: steps.filter.outputs.artifacts == 'true'
        run: spec-ops health --numbering

      - name: Verify SpecOps health & file length invariants (<500 lines)
        if: steps.filter.outputs.health == 'true'
        run: spec-ops health

      - name: Execute blackbox test suite
        if: steps.filter.outputs.python == 'true'
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx aiosqlite
          pytest

  # Deliberately NOT run here: eslint (9 pre-existing problems), `tsc -b` / `npm run build`
  # (70 pre-existing type errors in test files) and Playwright e2e (needs a backend + browsers).
  # Runs on every PR (no path filter) so the check always reports and can be made required.
  frontend-tests:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20" # keep in sync with NODE_VERSION in deploy.yml
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

      - name: Build frontend
        run: npx vite build
