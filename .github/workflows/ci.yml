name: CI Quality Gate (movie-ranking)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  preflight-and-invariants:
    name: SpecOps Invariant & Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect file changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            artifacts:
              - 'docs/project/adrs/**'
              - 'docs/project/product/**'
              - 'docs/project/backlog/**'
              - 'docs/project/user_stories/**'
              - '.github/workflows/ci.yml'
            health:
              - 'tests/**'
              - '**/*.py'
              - '**/*.ts'
              - '**/*.js'
              - '**/*.html'
              - '**/*.css'
              - 'docs/project/backlog/**'
              - 'docs/project/adrs/**'
              - 'AGENTS.md'
              - 'specops.toml'
              - '.github/workflows/ci.yml'
            python:
              - 'tests/**'
              - '**/*.py'
              - 'pyproject.toml'
              - 'requirements*.txt'
              - 'specops.toml'
              - '.github/workflows/ci.yml'

      - name: Install uv
        if: steps.filter.outputs.artifacts == 'true' || steps.filter.outputs.health == 'true' || steps.filter.outputs.python == 'true'
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Set up Python
        if: steps.filter.outputs.artifacts == 'true' || steps.filter.outputs.health == 'true' || steps.filter.outputs.python == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install SpecOps
        if: steps.filter.outputs.artifacts == 'true' || steps.filter.outputs.health == 'true' || steps.filter.outputs.python == 'true'
        run: uv tool install "git+https://github.com/tyevans/spec-ops@9745c40"

      - name: Verify artifact numbering uniqueness (ADRs, PRDs, Tasks, Stories)
        if: steps.filter.outputs.artifacts == 'true'
        run: spec-ops health --numbering

      - name: Verify SpecOps health & file length invariants (<500 lines)
        if: steps.filter.outputs.health == 'true'
        run: spec-ops health

      - name: Verify pinned requirements match pyproject.toml
        if: steps.filter.outputs.python == 'true'
        run: |
          uv pip compile pyproject.toml --python-version 3.12 --universal -o requirements.txt
          uv pip compile pyproject.toml --extra dev --python-version 3.12 --universal -o requirements-dev.txt
          git diff --exit-code -- requirements.txt requirements-dev.txt || {
            echo "::error::requirements*.txt are out of date. Re-run the uv pip compile commands from CLAUDE.md and commit the result."
            exit 1
          }

      - name: Execute blackbox test suite
        if: steps.filter.outputs.python == 'true'
        run: |
          pip install -r requirements-dev.txt
          pytest

  # Runs on every PR and push (no path filter) so the check always reports and can be made required (ADR-0007).
  backend-postgres:
    name: Backend Migrations (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: movie_ranking
          POSTGRES_PASSWORD: ci_password # pragma: allowlist secret
          POSTGRES_DB: movie_ranking
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U movie_ranking"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://movie_ranking:ci_password@localhost:5432/movie_ranking # pragma: allowlist secret
      SECRET_KEY: ci-dummy-secret-key-not-for-production # pragma: allowlist secret
      TMDB_API_KEY: ci-dummy-tmdb-key # pragma: allowlist secret

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12" # keep in sync with PYTHON_VERSION in deploy.yml (Lambda runtime)

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply all migrations from an empty database
        run: alembic upgrade head

      - name: Downgrade to base
        run: alembic downgrade base

      - name: Re-apply all migrations
        run: alembic upgrade head

      - name: Assert expected schema objects exist
        run: |
          python - <<'PY'
          import asyncio, os
          import asyncpg

          async def main() -> None:
              dsn = os.environ["DATABASE_URL"].replace("+asyncpg", "")
              conn = await asyncpg.connect(dsn)
              try:
                  table = await conn.fetchval("SELECT to_regclass('public.rankings')")
                  assert table is not None, "rankings table missing"
                  con = await conn.fetchval(
                      "SELECT 1 FROM pg_constraint WHERE conname = 'uq_user_movie'"
                  )
                  assert con == 1, "uq_user_movie constraint missing"
              finally:
                  await conn.close()

          asyncio.run(main())
          print("schema assertions passed")
          PY

  # Deliberately NOT run here: Playwright e2e (needs a backend + browsers).
  # Runs on every PR (no path filter) so the check always reports and can be made required.
  frontend-tests:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22" # keep in sync with NODE_VERSION in deploy.yml
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc -b

      - name: Run tests
        run: npm run test:run

      - name: Build frontend
        run: npx vite build

  # Runs on every PR (no path filter) so it can become a required check.
  api-contract:
    name: API Contract Drift Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22" # keep in sync with NODE_VERSION in deploy.yml
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Export OpenAPI document
        run: |
          pip install -r requirements.txt
          python scripts/export_openapi.py

      - name: Generate API types
        working-directory: frontend
        run: |
          npm ci
          npm run generate:api

      - name: Fail on API contract drift
        run: |
          git diff --exit-code -- frontend/openapi.json frontend/src/api/.generated/schema.d.ts || {
            echo "::error::API types are out of date. Run 'python scripts/export_openapi.py' and 'cd frontend && npm run generate:api', then commit the result."
            exit 1
          }
