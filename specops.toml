[project]
name = "movie-ranking"
repo = ""
docs_dir = "docs/project"
site_output = "dist/site"

[architecture]
file_length_limit = 500
buffer_target = 10
buffer_warning_threshold = 6

components = [
  { id = "backend", name = "FastAPI Backend", path = "app" },
  { id = "frontend", name = "React Frontend", path = "frontend/src" },
  { id = "infra", name = "AWS CDK Infrastructure", path = "infra/lib" }
]

[vertical_slices]
slices = [
  { type = "spike", name = "Architectural Spike", prefix = "SPIKE:", requires_adr = true },
  { type = "domain", name = "Domain Model & State Handlers" },
  { type = "api", name = "Public API Contracts" },
  { type = "ui", name = "User Interface & Component Stories" },
  { type = "test", name = "Blackbox Frontdoor Test Suite" }
]

[quality]
testing_style = "blackbox-frontdoor"
require_bdd = true
preflight = [
  "venv/bin/pytest"
]

[execution]
agent_command = "claude --dangerously-skip-permissions -p {prompt}"
agent_max_attempts = 3
git_branch_prefix = "feat/"
backlog_isolation = true

[profiles]
installed = ["core", "bdd"]
version = "0.1.0"

[invariants.file_limits]
grandfathered = [
  "app/routers/google_auth.py",
  "app/routers/import_amazon.py",
  "frontend/src/__tests__/mocks/handlers.ts",
  "frontend/src/components/ImportReview.tsx",
  "frontend/src/components/MovieSearch.test.tsx",
  "frontend/src/index.css",
  "frontend/src/styles/pages/analytics.css",
  "frontend/src/styles/pages/import.css",
  "tests/test_auth.py",
  "tests/test_google_auth.py",
  "tests/test_import_amazon.py",
  "tests/test_import_session.py",
  "tests/test_movies.py",
]

[audit.provenance]
baseline_commit = "1b4a1ec3fdc8d24daf6fe02e8b35080f3ece042f"
